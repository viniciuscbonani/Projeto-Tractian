[project]
name = "tractian-agent"
version = "0.1.0"
description = "Agente auditável para suporte industrial TRACTIAN"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.4,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]
evals = ["deepeval>=2,<4"]

[project.scripts]
tractian-agent = "tractian_agent.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tractian_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
